<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>第二大脑 · 认知与行动</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231D6E56'/%3E%3Ccircle cx='16' cy='16' r='7.5' fill='none' stroke='%23FDFCFA' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.2' fill='%23FDFCFA'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/v2.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><i class="brand-dot"></i><span>第二大脑</span><small>认知与行动</small></div>
    <div class="topsearch">
      <input id="global-q" placeholder="搜框架、知识点、来源、待办…">
      <button id="global-go" class="btn">搜索</button>
    </div>
    <div class="topmeta">
      <span id="model-badge" class="badge">模型状态…</span>
      <button class="link" id="toggle-right">收起对话栏</button>
      <button class="link" id="settings-btn">设置</button>
      <button class="link" id="legacy-btn" title="回到旧版文档界面（文档库，数据与本页不互通）">旧版</button>
    </div>
  </header>

  <div class="cols" id="cols">
    <aside class="col left" id="left-col">
      <div class="col-head"><span>知识库</span><span id="kb-count" class="count"></span></div>
      <div class="left-tools">
        <input id="kb-q" placeholder="筛选标题 / 领域">
        <div class="tool-row">
          <button class="btn" id="manual-btn">个人使用说明</button>
          <button class="btn" id="import-btn">导入现有文档</button>
        </div>
      </div>
      <div class="kb-scroll" id="kb-list"></div>
      <div class="left-foot" id="kb-foot"></div>
    </aside>

    <main class="col center" id="center-col">
      <div class="center-head">
        <span id="center-title">个人使用说明</span>
        <div class="chips">
          <button class="link hidden" id="clear-view">回到说明</button>
        </div>
      </div>
      <div class="doc" id="detail-view"></div>
    </main>

    <aside class="col right" id="right-col">
      <div class="right-tabs">
        <button class="tab on" data-tab="chat">对话</button>
        <button class="tab" data-tab="action">行动<span class="count" id="todo-count"></span></button>
      </div>

      <div class="pane" id="pane-chat">
        <div class="chat-log" id="chat-log"></div>
        <div class="composer">
          <div class="composer-tools">
            <label class="tool" title="投喂 PDF / Word / Markdown / 文本">＋ 文件
              <input type="file" id="file-input" hidden accept=".pdf,.docx,.md,.markdown,.txt,.csv">
            </label>
            <button class="tool" id="link-btn">＋ 链接</button>
            <button class="tool" id="voice-btn" title="语音补充内容">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><rect x="6" y="2" width="4" height="8" rx="2"/><path d="M3.5 7.5a4.5 4.5 0 0 0 9 0M8 12v2"/></svg>
              语音
            </button>
          </div>
          <div class="link-row hidden" id="link-row">
            <div class="row"><input id="link-url" placeholder="https://…"><input id="link-title" placeholder="标题（可留空）"></div>
            <textarea id="link-note" rows="2" placeholder="把字幕或摘要贴进来；留空则只登记链接，不擅自抓取"></textarea>
            <div class="row"><button class="btn accent" id="link-go">投喂链接</button><button class="link" id="link-cancel">取消</button></div>
          </div>
          <div class="entry">
            <textarea id="entry" rows="3" placeholder="写下想法、贴一段资料，或直接说话…"></textarea>
            <div class="entry-actions">
              <button class="link" id="distill-btn" title="把输入框这段整理进知识库，不当作对话">整理为知识</button>
              <span id="voice-status" class="hint"></span>
              <button class="btn accent" id="send-btn">发送</button>
            </div>
          </div>
          <div class="composer-note">说点什么，会自动整理进知识库；原文只作溯源，不会堆进库里</div>
        </div>
      </div>

      <div class="pane hidden" id="pane-action">
        <div class="situation">
          <div class="situation-head">
            <label for="situation">我现在的处境</label>
            <button class="link" id="plan-jump">用对话里的话</button>
          </div>
          <textarea id="situation" rows="2" placeholder="例如：想推进实习申请，但不确定先补作品还是先投简历"></textarea>
          <button class="btn accent wide" id="plan-btn">梳理：我面临什么问题、接下来做什么</button>
        </div>
        <div id="cheer" class="cheer hidden"></div>
        <div id="similar" class="similar"></div>
        <div id="problems" class="problems"></div>
        <div class="todos" id="todos"></div>
        <div class="right-foot" id="loop-hint"></div>
      </div>
    </aside>
  </div>
</div>

<div class="modal hidden" id="settings-modal">
  <div class="modal-card">
    <div class="modal-head"><span>模型设置</span><button class="link" id="settings-close">关闭</button></div>
    <p class="muted">模型密钥只存在本机。未配置或调用失败时，提炼与梳理自动走确定性规则版，整条闭环仍可用。</p>
    <div id="cfg-models" class="cfg-models"></div>
    <div class="cfg-form">
      <label>Base URL<input id="cfg-base" placeholder="https://api.deepseek.com/v1"></label>
      <label>模型名<input id="cfg-model" placeholder="deepseek-chat"></label>
      <label>API Key<input id="cfg-key" type="password" placeholder="新增模型时必填"></label>
      <div class="row"><button class="btn accent" id="cfg-save">保存并启用</button><button class="btn" id="cfg-test">测试连接</button></div>
      <div id="cfg-status" class="muted"></div>
    </div>
  </div>
</div>

<div class="toast hidden" id="toast"></div>
<script src="/v2.js"></script>
</body>
</html>
